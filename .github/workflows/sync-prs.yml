name: Sync pull requests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: pr-record-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize PR record
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PR Record
        run: python -m pip install --disable-pip-version-check .

      - name: Synchronize and render
        env:
          PR_READ_TOKEN: ${{ secrets.PR_READ_TOKEN }}
        run: python -m pr_record sync

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- README.md data/prs.json; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/prs.json
          git commit -m "chore: sync pull request record"
          git push
